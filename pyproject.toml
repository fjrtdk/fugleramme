[project]
name = "fugleramme"
version = "0.1.0"
description = "Local birdsong detection PWA"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "aiosqlite>=0.20",
    "email-validator>=2.0",
    "httpx>=0.27",
    # BirdNET inference — install ONE of the following (all provide the same API):
    #   tflite-runtime>=2.14   works on Linux x86-64 / Python ≤3.10
    #   ai-edge-litert>=1.0    Google's 2024 rename; recommended on Python 3.11+/macOS ARM
    #   tensorflow             full TF (large); last resort if the above fail
    "numpy>=1.26",
    "ai-edge-litert>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

